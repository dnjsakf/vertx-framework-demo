dms_agent.sources = source1
dms_agent.channels = channel1
dms_agent.sinks = sink1 sink2 sink3
#dms_agent.sinks = sink1 sink2 sink3 sink4 sink5 sink6 sink7 sink8 sink9 sink10

# Kafka source 설정
dms_agent.sources.source1.type = org.apache.flume.source.kafka.KafkaSource
# 소스 배치 크기를 100으로 설정
dms_agent.sources.source1.batchSize = 10000
dms_agent.sources.source1.channels = channel1
dms_agent.sources.source1.kafka.bootstrap.servers = localhost:9094
dms_agent.sources.source1.kafka.topics = topic-navilog2-acs-post-json
dms_agent.sources.source1.kafka.consumer.group.id = acs-group
dms_agent.sources.source1.kafka.consumer.security.protocol = SASL_PLAINTEXT
dms_agent.sources.source1.kafka.consumer.sasl.mechanism = PLAIN
dms_agent.sources.source1.kafka.consumer.sasl.jaas.config = org.apache.kafka.common.security.plain.PlainLoginModule required \
    username="consumer1" \
    password="consumer-zjstbaj1!";

dms_agent.sources.source1.interceptors = custom
dms_agent.sources.source1.interceptors.custom.type = com.dms.apps.flume.source.FlumeCustomInterceptor$Builder
# Partition 정적 할당
dms_agent.sources.source1.kafka.consumer.partitioner.class = org.apache.kafka.clients.consumer.StickyAssignor

# Memory channel 설정
dms_agent.channels.channel1.type = memory
dms_agent.channels.channel1.capacity = 1000000
dms_agent.channels.channel1.transactionCapacity = 10000

# Logger sink 설정
# dms_agent.sinks.sink1.type = logger
# dms_agent.sinks.sink1.channel = channel1
dms_agent.sinks.sink1.type = com.dms.apps.flume.sink.FlumeJDBCSink
dms_agent.sinks.sink1.channel = channel1
dms_agent.sinks.sink1.backoff.period = 5000
dms_agent.sinks.sink1.max.backoff = 5
dms_agent.sinks.sink1.min.backoff = 1

dms_agent.sinks.sink2.type = com.dms.apps.flume.sink.FlumeJDBCSink
dms_agent.sinks.sink2.channel = channel1
dms_agent.sinks.sink2.backoff.period = 5000
dms_agent.sinks.sink2.max.backoff = 5
dms_agent.sinks.sink2.min.backoff = 1

dms_agent.sinks.sink3.type = com.dms.apps.flume.sink.FlumeJDBCSink
dms_agent.sinks.sink3.channel = channel1
dms_agent.sinks.sink3.backoff.period = 5000
dms_agent.sinks.sink3.max.backoff = 5
dms_agent.sinks.sink3.min.backoff = 1

